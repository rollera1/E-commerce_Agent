name: ecommerce-agent

services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce-agent-mysql
    restart: unless-stopped
    ports:
      # Only the server itself can reach MySQL. Developers connect through SSH.
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_agent}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-agent-postgres
    restart: unless-stopped
    ports:
      # PostgreSQL 仅保存 Python Agent 运行时数据，开发机通过 SSH 隧道访问。
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_runtime}
      POSTGRES_USER: ${POSTGRES_USER:-agent_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_agent_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
    name: ecommerce-agent-mysql-data
  postgres_data:
    name: ecommerce-agent-postgres-data
