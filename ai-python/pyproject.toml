# Python 项目配置和依赖管理文件。
# 本文件使用 TOML 语法。

[project]
name = "ecommerce-agent-ai"
version = "0.1.0"
description = "Product source and future AI service for the ecommerce automation system"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.19.2",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain==1.4.2",
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.54",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100  # 每行代码最多 100 个字符。
target-version = "py312"  # 目标 Python 版本为 3.12。

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_agent_ai"]
